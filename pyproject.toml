[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-vidiq"
version = "0.1.0"
description = "Open-source YouTube outlier / SEO research agent — find what actually works on a channel and generate titles from it. Free, no paid tier."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.3",
    "streamlit==1.40.1",
    "google-generativeai==0.8.5",
    "python-dotenv==1.0.1",
]

[project.scripts]
openvidiq = "openvidiq.cli:main"

[tool.setuptools.packages.find]
include = ["openvidiq*"]
